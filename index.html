<title>마음의 숲</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column, calendar first, a bottom tab bar switching 마음일기 / 일정. */
:root {
  --bg: #F2F8F3;
  --surface: #FFFFFF;
  --surface-2: #E6F1E9;
  --fg: #1D2A23;
  --muted: #5C6F64;
  --line: #D3E3D8;
  --leaf: #2E8B57;
  --leaf-soft: #D5EEDD;
  --sun: #EFB441;
  --sun-soft: #FCEFCF;
  --ink: #18201B;
  --ink-fg: #F6FBF7;
  --danger: #C0503F;
  --c-leaf: #2E8B57;
  --c-sun: #E2A21F;
  --c-sky: #3F8FCF;
  --c-rose: #D9667F;
  --shadow: 0 6px 24px rgba(30, 70, 45, .08);
  --font-display: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-quote: "Gowun Batang", "AppleMyungjo", "Batang", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111915; --surface: #18231D; --surface-2: #203029; --fg: #E4EFE8; --muted: #98AEA1;
    --line: #2C3D34; --leaf: #5BC189; --leaf-soft: #1D3A2A; --sun: #F0C062; --sun-soft: #3A311D;
    --ink: #040605; --ink-fg: #E9F3ED; --danger: #E57B6B;
    --c-leaf: #5BC189; --c-sun: #F0C062; --c-sky: #6FB2E6; --c-rose: #EC8DA2;
    --shadow: 0 6px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111915; --surface: #18231D; --surface-2: #203029; --fg: #E4EFE8; --muted: #98AEA1;
  --line: #2C3D34; --leaf: #5BC189; --leaf-soft: #1D3A2A; --sun: #F0C062; --sun-soft: #3A311D;
  --ink: #040605; --ink-fg: #E9F3ED; --danger: #E57B6B;
  --c-leaf: #5BC189; --c-sun: #F0C062; --c-sky: #6FB2E6; --c-rose: #EC8DA2;
  --shadow: 0 6px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--leaf); outline-offset: 2px; }

.app {
  max-width: 520px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px 110px;
  display: flex; flex-direction: column; gap: 18px;
}

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 34px; height: 34px; flex: none; }
.brand h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 24px; letter-spacing: -.01em; }
.brand small { display: block; font-size: 12px; color: var(--muted); line-height: 1.2; }
.today-chip { font-size: 13px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }

/* today card */
.today-card { background: var(--leaf); color: #fff; border-radius: 22px; padding: 20px; display: flex; flex-direction: column; gap: 12px; position: relative; overflow: hidden; }
.today-card::after { content: ""; position: absolute; right: -40px; top: -40px; width: 150px; height: 150px; border-radius: 50%; background: var(--sun); opacity: .9; }
.today-card > * { position: relative; z-index: 1; }
.today-card .eyebrow { font-size: 12px; letter-spacing: .08em; opacity: .85; }
.today-card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; line-height: 1.35; text-wrap: balance; max-width: 15em; }
.today-card .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.btn-light { background: #fff; color: #1D4A31; border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 14px; }
.today-card .stat { font-size: 13px; opacity: .9; }

/* section titles */
.sec-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.sec-head h3 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 18px; }

/* calendar */
.cal { background: var(--surface); border-radius: 20px; padding: 14px 12px 12px; box-shadow: var(--shadow); }
.cal-nav { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 10px; }
.cal-nav strong { font-family: var(--font-display); font-weight: 400; font-size: 18px; font-variant-numeric: tabular-nums; }
.icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: transparent; display: grid; place-items: center; font-size: 16px; color: var(--muted); }
.icon-btn:disabled { opacity: .3; cursor: default; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal-dow { text-align: center; font-size: 12px; color: var(--muted); padding-bottom: 4px; }
.cal-dow:first-child { color: var(--c-rose); }
.cal-dow:last-child { color: var(--c-sky); }
.day {
  position: relative; aspect-ratio: 1 / 1.08; max-width: 100%; border: 0; border-radius: 14px; background: transparent;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 0; padding: 5px 0 0;
  font-size: 13px; font-variant-numeric: tabular-nums;
}
.day:hover:not(:disabled) { background: var(--surface-2); }
.day:disabled { opacity: .3; cursor: not-allowed; }
.day.empty { visibility: hidden; }
.day.sun { color: var(--c-rose); }
.day.sat { color: var(--c-sky); }
.day.today .num { background: var(--leaf); color: #fff; }
.day.sel { background: var(--leaf-soft); }
.day.done { background: var(--sun-soft); }
.day .num { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; line-height: 1; }
.day .mood { font-size: 19px; line-height: 1.2; margin-top: 1px; }
.day .pip { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); margin-top: 8px; opacity: .6; }
.day .dots { display: flex; gap: 3px; margin-top: 7px; }
.day .dots i { width: 6px; height: 6px; border-radius: 50%; display: block; }
.cal-legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 6px 0; font-size: 12px; color: var(--muted); }
.cal-legend span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legend i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }

/* editor */
.ed-head { display: flex; align-items: center; gap: 10px; }
.ed-head h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 21px; }
.ed-head p { margin: 0; font-size: 13px; color: var(--muted); }
.panel { background: var(--surface); border-radius: 20px; padding: 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.panel h3 { margin: 0; font-size: 15px; font-weight: 700; }
.panel .hint { margin: 0; font-size: 13px; color: var(--muted); }
.moods { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.mood-btn { border: 1.5px solid transparent; background: var(--surface-2); border-radius: 14px; padding: 8px 0 6px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.mood-btn .e { font-size: 24px; line-height: 1.1; }
.mood-btn .l { font-size: 10.5px; color: var(--muted); white-space: nowrap; }
.mood-btn[aria-pressed="true"] { border-color: var(--leaf); background: var(--leaf-soft); }
.mood-btn[aria-pressed="true"] .l { color: var(--fg); font-weight: 700; }

.progress { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.progress .bar { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
.progress .bar i { height: 6px; border-radius: 3px; background: var(--surface-2); display: block; }
.progress .bar i.on { background: var(--ink); }
.progress .bar i.half { background: var(--sun); }

.entries { display: flex; flex-direction: column; gap: 12px; }
.entry { border: 1px solid var(--line); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.entry-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); letter-spacing: .04em; }
.entry-top .tag { display: inline-flex; align-items: center; gap: 6px; }
.entry-top .tag b { color: var(--fg); font-weight: 700; letter-spacing: 0; }
.link-btn { border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 4px 6px; text-decoration: underline; text-underline-offset: 3px; }
.link-btn.danger { color: var(--danger); }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); resize: vertical; min-height: 72px; line-height: 1.55; }
textarea:focus { outline: 2px solid var(--leaf); outline-offset: 0; border-color: transparent; }
.btn { border: 0; border-radius: 999px; padding: 10px 18px; font-weight: 700; font-size: 14px; background: var(--leaf); color: #fff; }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: var(--surface-2); color: var(--fg); }
.btn.sun { background: var(--sun); color: #3A2A05; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; align-items: center; }

.cover-zone { position: relative; border-radius: 12px; overflow: hidden; background: var(--bg); border: 1px dashed var(--muted); touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.cover-zone .neg-text { padding: 12px 14px; min-height: 56px; white-space: pre-wrap; word-break: break-word; }
.cover-zone canvas { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }
.swipe-hint { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.swipe-hint .arrow { display: inline-block; animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(8px); } }

.ink { background: var(--ink); color: var(--ink-fg); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ink.reveal { animation: inkIn .5s ease-out; }
@keyframes inkIn { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
.ink label { font-size: 12px; opacity: .7; }
.ink textarea { background: transparent; color: var(--ink-fg); border-color: rgba(255,255,255,.25); }
.ink textarea::placeholder { color: rgba(255,255,255,.5); }
.ink .pos { font-family: var(--font-quote); font-size: 16px; white-space: pre-wrap; word-break: break-word; }
.ink .pos::before { content: "🌱 "; }
.peek { font-size: 13px; color: var(--muted); background: var(--surface-2); border-radius: 10px; padding: 8px 12px; white-space: pre-wrap; word-break: break-word; }
.peek b { display: block; font-size: 11.5px; font-weight: 500; letter-spacing: .04em; }

.add-btn { border: 1.5px dashed var(--line); background: transparent; border-radius: 16px; padding: 14px; color: var(--muted); font-weight: 500; }
.add-btn:hover { border-color: var(--leaf); color: var(--leaf); }
.finish { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.finish .btn { padding: 14px; font-size: 16px; }
.finish p { margin: 0; text-align: center; font-size: 12.5px; color: var(--muted); }

.done-banner { background: var(--sun-soft); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.done-banner .eyebrow { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.done-banner blockquote { margin: 0; font-family: var(--font-quote); font-size: 17px; line-height: 1.6; text-wrap: balance; }
.done-banner cite { font-style: normal; font-size: 13px; color: var(--muted); }

/* schedule */
.ev-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.ev { display: flex; align-items: center; gap: 10px; background: var(--bg); border-radius: 12px; padding: 10px 10px 10px 0; overflow: hidden; }
.ev .stripe { width: 5px; align-self: stretch; border-radius: 0 4px 4px 0; flex: none; }
.ev .time { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 44px; }
.ev .title { flex: 1; min-width: 0; word-break: break-word; }
.ev .del { border: 0; background: none; color: var(--muted); font-size: 12.5px; padding: 4px 6px; white-space: nowrap; }
.ev .del.confirm { color: var(--danger); font-weight: 700; }
.empty-note { margin: 0; font-size: 13.5px; color: var(--muted); padding: 6px 0; }
.ev-form { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
.ev-form .row { display: flex; gap: 8px; flex-wrap: wrap; }
.ev-form input[type="text"], .ev-form input[type="time"] { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); min-width: 0; }
.ev-form input[type="text"] { flex: 1 1 180px; }
.ev-form input[type="time"] { flex: 0 0 auto; }
.swatches { display: flex; gap: 8px; align-items: center; }
.swatch { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1.5px var(--line); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2.5px var(--fg); }

/* tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  background: var(--surface); border-top: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px));
}
.tabbar-inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tab { border: 0; background: transparent; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; align-items: center; gap: 2px; color: var(--muted); font-size: 12.5px; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-selected="true"] { background: var(--leaf-soft); color: var(--fg); font-weight: 700; }
.tab[aria-selected="true"] svg { color: var(--leaf); }

/* quote modal */
.modal { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); background: rgba(16, 32, 22, .45); }
.modal-card { width: 100%; max-width: 420px; background: var(--surface); border-radius: 26px; padding: 28px 22px 22px; text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; animation: rise .5s cubic-bezier(.2,.8,.2,1); position: relative; overflow: hidden; }
.modal-card .sunrise { width: 84px; height: 84px; border-radius: 50%; background: radial-gradient(circle at 50% 60%, var(--sun) 0 52%, var(--sun-soft) 53% 100%); display: grid; place-items: center; font-size: 34px; }
.modal-card .eyebrow { font-size: 12.5px; letter-spacing: .1em; color: var(--leaf); font-weight: 700; }
.modal-card blockquote { margin: 0; font-family: var(--font-quote); font-size: 20px; line-height: 1.6; text-wrap: balance; }
.modal-card cite { font-style: normal; font-size: 13px; color: var(--muted); }
.modal-card .sum { font-size: 13px; color: var(--muted); margin: 0; }
@keyframes rise { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="29" cy="11" r="7" fill="var(--sun)"></circle>
        <path d="M14 34 L14 26" stroke="var(--fg)" stroke-width="2.4" stroke-linecap="round"></path>
        <path d="M14 6 C 22 13, 22 24, 14 27 C 6 24, 6 13, 14 6 Z" fill="var(--leaf)"></path>
        <path d="M26 34 L26 29" stroke="var(--fg)" stroke-width="2" stroke-linecap="round"></path>
        <path d="M26 18 C 31 22, 31 28, 26 30 C 21 28, 21 22, 26 18 Z" fill="var(--c-leaf)" opacity=".65"></path>
      </svg>
      <div>
        <h1>마음의 숲</h1>
        <small>부정은 덮고, 긍정으로 다시 쓰는 하루</small>
      </div>
    </div>
    <span class="today-chip" id="todayChip"></span>
  </header>

  <!-- 마음일기: 캘린더 -->
  <section id="viewDiary" aria-label="마음일기" style="display:flex;flex-direction:column;gap:18px">
    <div class="today-card" id="todayCard"></div>
    <div class="cal">
      <div class="cal-nav">
        <button class="icon-btn" id="dPrev" aria-label="이전 달">‹</button>
        <strong id="dTitle"></strong>
        <button class="icon-btn" id="dNext" aria-label="다음 달">›</button>
      </div>
      <div class="cal-grid" id="dGrid"></div>
      <div class="cal-legend">
        <span><i style="background:var(--sun-soft)"></i>일기 완료</span>
        <span><i style="background:var(--leaf)"></i>오늘</span>
        <span>미래 날짜는 아직 쓸 수 없어요</span>
      </div>
    </div>
  </section>

  <!-- 마음일기: 작성/보기 -->
  <section id="viewEditor" hidden aria-label="일기 쓰기" style="display:flex;flex-direction:column;gap:16px"></section>

  <!-- 일정 -->
  <section id="viewSched" hidden aria-label="일정" style="display:flex;flex-direction:column;gap:18px">
    <div class="cal">
      <div class="cal-nav">
        <button class="icon-btn" id="sPrev" aria-label="이전 달">‹</button>
        <strong id="sTitle"></strong>
        <button class="icon-btn" id="sNext" aria-label="다음 달">›</button>
      </div>
      <div class="cal-grid" id="sGrid"></div>
    </div>
    <div class="panel" id="sPanel"></div>
  </section>
</div>

<nav class="tabbar" aria-label="탭">
  <div class="tabbar-inner" role="tablist">
    <button class="tab" role="tab" id="tabDiary" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21v-6"></path><path d="M12 3c5 4 5 10 0 12-5-2-5-8 0-12z"></path></svg>
      마음일기
    </button>
    <button class="tab" role="tab" id="tabSched" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"></rect><path d="M3.5 10h17M8 3v4M16 3v4"></path></svg>
      일정
    </button>
  </div>
</nav>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="mQuote">
  <div class="modal-card">
    <div class="sunrise" aria-hidden="true">🌤️</div>
    <div class="eyebrow">오늘의 일기 완료</div>
    <blockquote id="mQuote"></blockquote>
    <cite id="mCite"></cite>
    <p class="sum" id="mSum"></p>
    <button class="btn" id="mClose" style="min-width:160px">고마워요</button>
  </div>
</div>

<script>
(function () {
  const MOODS = [
    { e: "😄", l: "최고" }, { e: "🙂", l: "좋음" }, { e: "😐", l: "그럭저럭" },
    { e: "😔", l: "울적" }, { e: "😢", l: "슬픔" }, { e: "😠", l: "화남" }, { e: "😫", l: "지침" }
  ];
  const QUOTES = [
    { t: "오늘 하루를 버텨낸 것만으로도 충분히 잘했어요.", a: "마음의 숲" },
    { t: "우리를 괴롭히는 것은 일 그 자체가 아니라, 그 일에 대한 우리의 생각이다.", a: "에픽테토스" },
    { t: "천 리 길도 한 걸음부터.", a: "노자" },
    { t: "마음은 그 사람이 품는 생각의 색으로 물든다.", a: "마르쿠스 아우렐리우스" },
    { t: "우리는 현실보다 상상 속에서 더 자주 괴로워한다.", a: "세네카" },
    { t: "얼굴을 햇살 쪽으로 두면 그림자는 보이지 않는다.", a: "헬렌 켈러" },
    { t: "나는 오늘, 나에게 조금 더 다정해질 거예요.", a: "긍정 확언" },
    { t: "내 감정은 소중하고, 그 감정을 느끼는 나도 소중해요.", a: "긍정 확언" },
    { t: "흐린 날에도 숲은 자라요. 나도 그래요.", a: "마음의 숲" },
    { t: "이 또한 지나가리라.", a: "옛 지혜" },
    { t: "인내는 쓰다. 그러나 그 열매는 달다.", a: "장 자크 루소" },
    { t: "물은 가장 부드럽지만 가장 단단한 것을 이긴다.", a: "노자, 『도덕경』" },
    { t: "오늘은 할 수 있는 만큼만 해도 괜찮아요.", a: "긍정 확언" },
    { t: "나는 어제보다 나를 조금 더 이해하게 되었어요.", a: "긍정 확언" },
    { t: "작은 것에 고마워하는 마음이 나를 지켜줘요.", a: "긍정 확언" },
    { t: "삶이 있는 한 희망은 있다.", a: "키케로" },
    { t: "나쁜 하루였을 뿐, 나쁜 인생은 아니에요.", a: "마음의 숲" },
    { t: "숨을 깊게 들이쉬고 천천히 내쉬어요. 지금 이 순간, 나는 괜찮아요.", a: "긍정 확언" },
    { t: "자기 자신을 사랑하는 것은 평생 이어질 로맨스의 시작이다.", a: "오스카 와일드" },
    { t: "하늘이 무너져도 솟아날 구멍이 있다.", a: "우리 속담" },
    { t: "고생 끝에 낙이 온다.", a: "우리 속담" },
    { t: "넘어진 자리에서 다시 일어서는 것, 그게 나의 힘이에요.", a: "긍정 확언" },
    { t: "내일의 나는 오늘의 나에게 고마워할 거예요.", a: "마음의 숲" },
    { t: "가장 깊은 밤이 지나야 새벽이 온다.", a: "옛 지혜" },
    { t: "나는 충분히 괜찮은 사람이에요. 있는 그대로도.", a: "긍정 확언" }
  ];
  const ORD = ["첫 번째", "두 번째", "세 번째", "네 번째", "다섯 번째"];
  const DOW = ["일", "월", "화", "수", "목", "금", "토"];
  const COLORS = [
    { k: "leaf", n: "초록" }, { k: "sun", n: "노랑" }, { k: "sky", n: "파랑" }, { k: "rose", n: "분홍" }
  ];
  const MAX = 5;

  const $ = (id) => document.getElementById(id);
  const pad = (n) => String(n).padStart(2, "0");
  const keyOf = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;
  const todayKey = () => { const t = new Date(); return keyOf(t.getFullYear(), t.getMonth(), t.getDate()); };
  const parseKey = (k) => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
  const longDate = (k) => { const d = parseKey(k); return `${d.getMonth() + 1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일`; };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------- storage: browser cache + private per-person db when available ---------- */
  const data = {};
  const LS = "maeum-forest:";
  function lsSet(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} }
  try {
    Object.keys(localStorage).forEach((k) => {
      if (!k.startsWith(LS)) return;
      try { data[k.slice(LS.length)] = JSON.parse(localStorage.getItem(k)); } catch (e) {}
    });
  } catch (e) {}

  let col = null;
  const timers = {}, chains = {};
  function pushRemote(id) {
    if (!col || !data[id]) return;
    const body = JSON.parse(JSON.stringify(data[id]));
    chains[id] = (chains[id] || Promise.resolve()).then(() => col.doc(id).set(body)).catch(() => {});
  }
  function save(id) {
    data[id].updatedAt = Date.now();
    lsSet(id, data[id]);
    clearTimeout(timers[id]);
    timers[id] = setTimeout(() => pushRemote(id), 500);
  }
  async function initRemote() {
    if (!window.claude || typeof window.claude.use !== "function") return;
    try {
      const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
      if (!db || !user) return;
      const uid = await user.id();
      if (!uid) return;
      const c = db.collection("data/users/" + uid);
      const snap = await c.get();
      const remote = {};
      snap.docs.forEach((d) => { remote[d.id] = d.data(); });
      Object.keys(remote).forEach((id) => {
        const r = remote[id], l = data[id];
        if (r && (!l || (r.updatedAt || 0) >= (l.updatedAt || 0))) { data[id] = JSON.parse(JSON.stringify(r)); lsSet(id, data[id]); }
      });
      col = c;
      Object.keys(data).forEach((id) => {
        const r = remote[id];
        if (!r || (data[id].updatedAt || 0) > (r.updatedAt || 0)) pushRemote(id);
      });
      renderCalendars();
      if (state.editing && !$("viewEditor").contains(document.activeElement)) renderEditor();
    } catch (e) {}
  }

  const diaryId = (k) => "d-" + k;
  const getDiary = (k) => data[diaryId(k)] || null;
  function ensureDiary(k) {
    const id = diaryId(k);
    if (!data[id]) data[id] = { date: k, mood: null, entries: [], done: false, quote: null };
    return data[id];
  }
  const schedId = (k) => "s-" + k.slice(0, 7);
  function eventsOn(k) { const s = data[schedId(k)]; return s ? s.events.filter((e) => e.date === k) : []; }

  /* ---------- state ---------- */
  const now = new Date();
  const state = {
    tab: "diary",
    dY: now.getFullYear(), dM: now.getMonth(),
    sY: now.getFullYear(), sM: now.getMonth(),
    sDay: todayKey(),
    editing: null,
    peek: {},
    color: "leaf"
  };

  /* ---------- calendars ---------- */
  function buildGrid(grid, y, m, cellFn) {
    const first = new Date(y, m, 1).getDay();
    const days = new Date(y, m + 1, 0).getDate();
    let html = DOW.map((d) => `<div class="cal-dow">${d}</div>`).join("");
    for (let i = 0; i < first; i++) html += `<button class="day empty" tabindex="-1" aria-hidden="true"></button>`;
    for (let d = 1; d <= days; d++) {
      const k = keyOf(y, m, d);
      const dow = (first + d - 1) % 7;
      html += cellFn(k, d, dow === 0 ? " sun" : dow === 6 ? " sat" : "");
    }
    grid.innerHTML = html;
  }

  function renderDiaryCal() {
    const tk = todayKey();
    $("dTitle").textContent = `${state.dY}년 ${state.dM + 1}월`;
    $("dNext").disabled = state.dY > now.getFullYear() || (state.dY === now.getFullYear() && state.dM >= new Date().getMonth());
    buildGrid($("dGrid"), state.dY, state.dM, (k, d, wk) => {
      const dia = getDiary(k);
      const future = k > tk;
      let cls = "day" + wk + (k === tk ? " today" : "") + (dia && dia.done ? " done" : "");
      let inner = `<span class="num">${d}</span>`;
      if (dia && dia.mood != null) inner += `<span class="mood" aria-hidden="true">${MOODS[dia.mood].e}</span>`;
      else if (dia && dia.entries.some((e) => e.neg)) inner += `<span class="pip" aria-hidden="true"></span>`;
      const label = `${longDate(k)}${dia && dia.done ? ", 일기 완료" : ""}${dia && dia.mood != null ? ", 기분 " + MOODS[dia.mood].l : ""}`;
      return `<button class="${cls}" data-k="${k}" ${future ? "disabled" : ""} aria-label="${label}">${inner}</button>`;
    });
    renderTodayCard();
  }

  function renderTodayCard() {
    const tk = todayKey();
    const dia = getDiary(tk);
    const ym = tk.slice(0, 7);
    const doneCount = Object.keys(data).filter((id) => id.startsWith("d-" + ym) && data[id].done).length;
    const n = dia ? dia.entries.filter((e) => e.stage === "done").length : 0;
    let title, btn;
    if (!dia || (!dia.entries.length && dia.mood == null)) {
      title = "오늘 마음을 무겁게 한 일이 있었나요? 하나씩 적고, 덮고, 다시 써봐요.";
      btn = "오늘의 마음 기록하기";
    } else if (!dia.done) {
      title = `다시 쓴 일 ${n}개. 이어서 써도 되고, 여기서 마무리해도 괜찮아요.`;
      btn = "이어서 쓰기";
    } else {
      const q = QUOTES[dia.quote] || QUOTES[0];
      title = `“${q.t}”`;
      btn = "오늘 일기 다시 보기";
    }
    $("todayCard").innerHTML = `
      <div class="eyebrow">오늘 · ${esc(longDate(tk))}</div>
      <h2>${esc(title)}</h2>
      <div class="row">
        <button class="btn-light" id="openToday">${btn}</button>
        <span class="stat">이번 달 완료 ${doneCount}일${dia && dia.mood != null ? " · 오늘 기분 " + MOODS[dia.mood].e : ""}</span>
      </div>`;
    $("openToday").onclick = () => openEditor(tk);
  }

  function renderSchedCal() {
    const tk = todayKey();
    $("sTitle").textContent = `${state.sY}년 ${state.sM + 1}월`;
    buildGrid($("sGrid"), state.sY, state.sM, (k, d, wk) => {
      const evs = eventsOn(k);
      let cls = "day" + wk + (k === tk ? " today" : "") + (k === state.sDay ? " sel" : "");
      let inner = `<span class="num">${d}</span>`;
      if (evs.length) inner += `<span class="dots" aria-hidden="true">${evs.slice(0, 3).map((e) => `<i style="background:var(--c-${e.color})"></i>`).join("")}</span>`;
      return `<button class="${cls}" data-k="${k}" aria-label="${longDate(k)}${evs.length ? ", 일정 " + evs.length + "개" : ""}" aria-pressed="${k === state.sDay}">${inner}</button>`;
    });
    renderSchedPanel();
  }

  function renderSchedPanel() {
    const k = state.sDay;
    const evs = eventsOn(k).slice().sort((a, b) => (a.time || "99").localeCompare(b.time || "99"));
    $("sPanel").innerHTML = `
      <div class="sec-head"><h3>${esc(longDate(k))}</h3><span class="hint" style="font-size:13px;color:var(--muted)">${evs.length ? evs.length + "개의 일정" : ""}</span></div>
      ${evs.length ? `<ul class="ev-list">${evs.map((e) => `
        <li class="ev">
          <span class="stripe" style="background:var(--c-${e.color})"></span>
          <span class="time">${e.time ? esc(e.time) : "종일"}</span>
          <span class="title">${esc(e.title)}</span>
          <button class="del" data-del="${e.id}">삭제</button>
        </li>`).join("")}</ul>` : `<p class="empty-note">아직 일정이 없어요. 아래에서 추가해 보세요.</p>`}
      <form class="ev-form" id="evForm" autocomplete="off">
        <div class="row">
          <input type="time" id="evTime" aria-label="시간 (선택)">
          <input type="text" id="evTitle" placeholder="일정 내용 (예: 친구랑 산책)" aria-label="일정 내용" maxlength="80">
        </div>
        <div class="row" style="justify-content:space-between;align-items:center">
          <div class="swatches" role="group" aria-label="색상">
            ${COLORS.map((c) => `<button type="button" class="swatch" data-color="${c.k}" aria-label="${c.n}" aria-pressed="${state.color === c.k}" style="background:var(--c-${c.k})"></button>`).join("")}
          </div>
          <button class="btn" type="submit">추가</button>
        </div>
      </form>`;
    $("evForm").onsubmit = (ev) => {
      ev.preventDefault();
      const title = $("evTitle").value.trim();
      if (!title) { $("evTitle").focus(); return; }
      const id = schedId(k);
      if (!data[id]) data[id] = { events: [] };
      data[id].events.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), date: k, time: $("evTime").value || "", title, color: state.color });
      save(id);
      renderSchedCal();
      $("evTitle").focus();
    };
    $("sPanel").querySelectorAll(".swatch").forEach((b) => b.onclick = () => {
      state.color = b.dataset.color;
      $("sPanel").querySelectorAll(".swatch").forEach((x) => x.setAttribute("aria-pressed", x === b));
    });
    $("sPanel").querySelectorAll(".del").forEach((b) => b.onclick = () => {
      if (!b.classList.contains("confirm")) {
        b.classList.add("confirm"); b.textContent = "삭제할까요?";
        setTimeout(() => { if (b.isConnected) { b.classList.remove("confirm"); b.textContent = "삭제"; } }, 3000);
        return;
      }
      const id = schedId(k);
      data[id].events = data[id].events.filter((e) => e.id !== b.dataset.del);
      save(id);
      renderSchedCal();
    });
  }

  function renderCalendars() { renderDiaryCal(); renderSchedCal(); }

  /* ---------- diary editor ---------- */
  function openEditor(k) {
    if (k > todayKey()) return; // 미래 날짜는 작성 불가
    state.editing = k;
    state.peek = {};
    const dia = ensureDiary(k);
    if (!dia.entries.length) dia.entries.push({ neg: "", pos: "", stage: "write" });
    $("viewDiary").hidden = true;
    $("viewEditor").hidden = false;
    renderEditor();
    window.scrollTo(0, 0);
  }
  function closeEditor() {
    const dia = getDiary(state.editing);
    if (dia) {
      dia.entries = dia.entries.filter((e) => e.neg.trim() || e.pos.trim());
      if (!dia.entries.length && dia.mood == null && !dia.done) delete data[diaryId(state.editing)];
      else lsSet(diaryId(state.editing), dia);
    }
    state.editing = null;
    $("viewEditor").hidden = true;
    $("viewDiary").hidden = false;
    renderDiaryCal();
    window.scrollTo(0, 0);
  }

  function progressHtml(dia) {
    const cells = [];
    for (let i = 0; i < MAX; i++) {
      const e = dia.entries[i];
      cells.push(`<i class="${e ? (e.stage === "done" ? "on" : e.neg ? "half" : "") : ""}"></i>`);
    }
    const n = dia.entries.filter((e) => e.stage === "done").length;
    return `<div class="progress"><span>${n} / ${MAX}</span><div class="bar">${cells.join("")}</div></div>`;
  }

  function renderEditor() {
    const k = state.editing;
    const dia = ensureDiary(k);
    const isToday = k === todayKey();
    const q = dia.done ? (QUOTES[dia.quote] || QUOTES[0]) : null;
    const canAdd = dia.entries.length < MAX && dia.entries.every((e) => e.stage === "done");
    $("viewEditor").innerHTML = `
      <div class="ed-head">
        <button class="icon-btn" id="edBack" aria-label="캘린더로 돌아가기">‹</button>
        <div><h2>${esc(longDate(k))}</h2><p>${isToday ? "오늘의 마음일기" : "지난 마음일기"}${dia.done ? " · 완료" : ""}</p></div>
      </div>
      ${q ? `<div class="done-banner"><span class="eyebrow">이날 받은 한마디</span><blockquote>${esc(q.t)}</blockquote><cite>${esc(q.a)}</cite></div>` : ""}
      <div class="panel">
        <h3>오늘의 기분</h3>
        <div class="moods" role="group" aria-label="오늘의 기분">
          ${MOODS.map((m, i) => `<button class="mood-btn" data-mood="${i}" aria-pressed="${dia.mood === i}"><span class="e" aria-hidden="true">${m.e}</span><span class="l">${m.l}</span></button>`).join("")}
        </div>
      </div>
      <div class="panel">
        <h3>덮고, 다시 쓰기</h3>
        <p class="hint">힘들었던 일, 짜증났던 일, 싫었던 일을 하나 적어요. 그 글을 손가락으로 주욱 그어 까맣게 덮고, 그 위에 "이랬으면 좋았을 텐데"를 써보세요. 다섯 개를 다 채우지 않아도 괜찮아요.</p>
        ${progressHtml(dia)}
        <div class="entries" id="entries">${dia.entries.map((e, i) => entryHtml(e, i)).join("")}</div>
        ${canAdd ? `<button class="add-btn" id="addEntry">+ ${ORD[dia.entries.length]} 일 적기</button>` : ""}
      </div>
      <div class="finish">
        <button class="btn ${dia.done ? "ghost" : "sun"}" id="finish">${dia.done ? "위로의 한마디 다시 보기" : "오늘의 일기 완료"}</button>
        <p>${dia.done ? "완료한 뒤에도 내용을 고칠 수 있어요." : "다 채우지 않았어도 완료할 수 있어요."}</p>
      </div>`;
    wireEditor();
  }

  function entryHtml(e, i) {
    const del = `<button class="link-btn danger" data-act="remove" data-i="${i}">지우기</button>`;
    let body = "";
    if (e.stage === "write") {
      body = `
        <textarea id="neg-${i}" data-i="${i}" placeholder="오늘 힘들었거나 짜증났던 일을 솔직하게 적어요." maxlength="300">${esc(e.neg)}</textarea>
        <div class="btn-row"><button class="btn" data-act="toCover" data-i="${i}" ${e.neg.trim() ? "" : "disabled"}>다 적었어요</button></div>`;
    } else if (e.stage === "cover") {
      body = `
        <div class="cover-zone" id="zone-${i}">
          <div class="neg-text">${esc(e.neg)}</div>
          <canvas data-i="${i}" tabindex="0" aria-label="그어서 덮기. 키보드는 Enter로 덮어요."></canvas>
        </div>
        <div class="btn-row" style="justify-content:space-between">
          <span class="swipe-hint">왼쪽에서 오른쪽으로 주욱 그어 덮어요 <span class="arrow" aria-hidden="true">→</span></span>
          <button class="link-btn" data-act="toWrite" data-i="${i}">고치기</button>
        </div>`;
    } else if (e.stage === "reframe") {
      body = `
        <div class="ink${e.justCovered ? " reveal" : ""}">
          <label for="pos-${i}">이 일이 이랬으면 좋았을 것 같아요</label>
          <textarea id="pos-${i}" data-i="${i}" placeholder="예: 버스를 놓쳤지만 덕분에 천천히 걸으며 바람을 느꼈다면 좋았을 거예요." maxlength="300">${esc(e.pos)}</textarea>
          <div class="btn-row"><button class="btn" data-act="toDone" data-i="${i}" ${e.pos.trim() ? "" : "disabled"}>이렇게 바꿀래요</button></div>
        </div>`;
    } else {
      const peek = state.peek[i];
      body = `
        <div class="ink"><div class="pos">${esc(e.pos)}</div></div>
        ${peek ? `<div class="peek"><b>덮어둔 원래 내용</b>${esc(e.neg)}</div>` : ""}
        <div class="btn-row">
          <button class="link-btn" data-act="peek" data-i="${i}" aria-pressed="${!!peek}">${peek ? "원래 내용 숨기기" : "원래 내용 보기"}</button>
          <button class="link-btn" data-act="toReframe" data-i="${i}">고쳐 쓰기</button>
        </div>`;
    }
    return `<article class="entry" id="entry-${i}">
      <div class="entry-top"><span class="tag"><b>${ORD[i]} 일</b>${e.stage === "done" ? " · 다시 썼어요" : ""}</span>${del}</div>
      ${body}
    </article>`;
  }

  function rerenderEntry(i, focusId) {
    const dia = getDiary(state.editing);
    const el = $("entry-" + i);
    el.outerHTML = entryHtml(dia.entries[i], i);
    delete dia.entries[i].justCovered;
    wireEntry(i);
    const p = document.querySelector("#viewEditor .progress");
    if (p) p.outerHTML = progressHtml(dia);
    const canAdd = dia.entries.length < MAX && dia.entries.every((e) => e.stage === "done");
    const add = $("addEntry");
    if (canAdd && !add) {
      $("entries").insertAdjacentHTML("afterend", `<button class="add-btn" id="addEntry">+ ${ORD[dia.entries.length]} 일 적기</button>`);
      $("addEntry").onclick = addEntry;
    } else if (!canAdd && add) add.remove();
    if (focusId && $(focusId)) { const f = $(focusId); f.focus(); if (f.setSelectionRange) f.setSelectionRange(f.value.length, f.value.length); }
  }

  function addEntry() {
    const dia = getDiary(state.editing);
    dia.entries.push({ neg: "", pos: "", stage: "write" });
    renderEditor();
    const t = $("neg-" + (dia.entries.length - 1));
    if (t) { t.focus(); t.scrollIntoView({ block: "center", behavior: "smooth" }); }
  }

  function wireEditor() {
    const dia = getDiary(state.editing);
    $("edBack").onclick = closeEditor;
    document.querySelectorAll(".mood-btn").forEach((b) => b.onclick = () => {
      const m = Number(b.dataset.mood);
      dia.mood = dia.mood === m ? null : m;
      save(diaryId(state.editing));
      document.querySelectorAll(".mood-btn").forEach((x) => x.setAttribute("aria-pressed", Number(x.dataset.mood) === dia.mood));
    });
    dia.entries.forEach((_, i) => wireEntry(i));
    if ($("addEntry")) $("addEntry").onclick = addEntry;
    $("finish").onclick = finish;
  }

  function wireEntry(i) {
    const k = state.editing;
    const dia = getDiary(k);
    const e = dia.entries[i];
    const root = $("entry-" + i);
    root.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => {
      const act = b.dataset.act;
      if (act === "toCover") { e.neg = e.neg.trim(); e.stage = "cover"; save(diaryId(k)); rerenderEntry(i); }
      else if (act === "toWrite") { e.stage = "write"; save(diaryId(k)); rerenderEntry(i, "neg-" + i); }
      else if (act === "toDone") { e.pos = e.pos.trim(); e.stage = "done"; save(diaryId(k)); rerenderEntry(i); }
      else if (act === "toReframe") { e.stage = "reframe"; save(diaryId(k)); rerenderEntry(i, "pos-" + i); }
      else if (act === "peek") { state.peek[i] = !state.peek[i]; rerenderEntry(i); }
      else if (act === "remove") {
        if (!b.classList.contains("confirm")) {
          b.classList.add("confirm"); b.textContent = "정말 지울까요?";
          setTimeout(() => { if (b.isConnected) { b.classList.remove("confirm"); b.textContent = "지우기"; } }, 3000);
          return;
        }
        dia.entries.splice(i, 1);
        if (!dia.entries.length) dia.entries.push({ neg: "", pos: "", stage: "write" });
        state.peek = {};
        save(diaryId(k));
        renderEditor();
      }
    });
    const neg = $("neg-" + i);
    if (neg) neg.oninput = () => {
      e.neg = neg.value; save(diaryId(k));
      root.querySelector('[data-act="toCover"]').disabled = !neg.value.trim();
    };
    const pos = $("pos-" + i);
    if (pos) pos.oninput = () => {
      e.pos = pos.value; save(diaryId(k));
      root.querySelector('[data-act="toDone"]').disabled = !pos.value.trim();
    };
    const cv = root.querySelector("canvas");
    if (cv) setupCover(cv, i);
  }

  /* ---------- swipe-to-cover ---------- */
  function setupCover(cv, i) {
    const zone = cv.parentElement;
    const ctx = cv.getContext("2d");
    const BINS = 28;
    const hit = new Array(BINS).fill(false);
    let w = 0, h = 0, last = null, finished = false;
    function size() {
      const r = zone.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      w = r.width; h = r.height;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    size();
    const ink = getComputedStyle(document.documentElement).getPropertyValue("--ink").trim() || "#18201B";
    const pt = (ev) => { const r = cv.getBoundingClientRect(); return { x: ev.clientX - r.left, y: ev.clientY - r.top }; };
    function mark(x1, x2) {
      const rad = h * 0.6;
      const a = Math.max(0, Math.min(x1, x2) - rad), b = Math.min(w, Math.max(x1, x2) + rad);
      for (let j = Math.floor(a / w * BINS); j < Math.min(BINS, Math.ceil(b / w * BINS)); j++) hit[j] = true;
    }
    function stroke(p) {
      ctx.strokeStyle = ink; ctx.lineCap = "round"; ctx.lineJoin = "round";
      ctx.lineWidth = Math.max(h * 1.25, 44);
      ctx.beginPath(); ctx.moveTo(last.x, h / 2 + (last.y - h / 2) * .25); ctx.lineTo(p.x, h / 2 + (p.y - h / 2) * .25); ctx.stroke();
      mark(last.x, p.x);
      last = p;
      if (hit.filter(Boolean).length / BINS >= 0.82) complete();
    }
    function complete() {
      if (finished) return;
      finished = true;
      ctx.fillStyle = ink; ctx.fillRect(0, 0, w, h);
      if (navigator.vibrate) { try { navigator.vibrate(20); } catch (e) {} }
      setTimeout(() => {
        const dia = getDiary(state.editing);
        const e = dia.entries[i];
        e.stage = "reframe"; e.justCovered = true;
        save(diaryId(state.editing));
        rerenderEntry(i, "pos-" + i);
      }, 260);
    }
    cv.addEventListener("pointerdown", (ev) => {
      if (finished) return;
      cv.setPointerCapture(ev.pointerId);
      last = pt(ev);
      stroke({ x: last.x + 0.1, y: last.y });
    });
    cv.addEventListener("pointermove", (ev) => { if (last && !finished) stroke(pt(ev)); });
    const end = () => { last = null; };
    cv.addEventListener("pointerup", end);
    cv.addEventListener("pointercancel", end);
    cv.addEventListener("keydown", (ev) => { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); complete(); } });
  }

  /* ---------- finish + quote ---------- */
  function finish() {
    const k = state.editing;
    const dia = getDiary(k);
    if (!dia.done) {
      dia.entries = dia.entries.filter((e) => e.neg.trim() || e.pos.trim());
      dia.done = true;
      if (dia.quote == null) dia.quote = Math.floor(Math.random() * QUOTES.length);
      save(diaryId(k));
    }
    const q = QUOTES[dia.quote] || QUOTES[0];
    const n = dia.entries.filter((e) => e.stage === "done").length;
    $("mQuote").textContent = q.t;
    $("mCite").textContent = "— " + q.a;
    $("mSum").textContent = n ? `오늘 ${n}개의 마음을 덮고 다시 썼어요.` : "오늘도 마음을 들여다본 나, 잘했어요.";
    $("modal").hidden = false;
    $("mClose").focus();
  }
  function closeModal() {
    $("modal").hidden = true;
    if (state.editing) {
      if (!getDiary(state.editing).entries.length) getDiary(state.editing).entries.push({ neg: "", pos: "", stage: "write" });
      renderEditor();
    }
  }
  $("mClose").onclick = closeModal;
  $("modal").addEventListener("click", (ev) => { if (ev.target === $("modal")) closeModal(); });
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !$("modal").hidden) closeModal(); });

  /* ---------- nav ---------- */
  $("dGrid").addEventListener("click", (ev) => {
    const b = ev.target.closest(".day[data-k]");
    if (b && !b.disabled) openEditor(b.dataset.k);
  });
  $("sGrid").addEventListener("click", (ev) => {
    const b = ev.target.closest(".day[data-k]");
    if (!b) return;
    state.sDay = b.dataset.k;
    renderSchedCal();
  });
  function shift(prefix, delta) {
    let y = state[prefix + "Y"], m = state[prefix + "M"] + delta;
    if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; }
    state[prefix + "Y"] = y; state[prefix + "M"] = m;
  }
  $("dPrev").onclick = () => { shift("d", -1); renderDiaryCal(); };
  $("dNext").onclick = () => { shift("d", 1); renderDiaryCal(); };
  $("sPrev").onclick = () => { shift("s", -1); renderSchedCal(); };
  $("sNext").onclick = () => { shift("s", 1); renderSchedCal(); };

  function setTab(t) {
    if (state.editing && t !== "diary") closeEditor();
    state.tab = t;
    $("tabDiary").setAttribute("aria-selected", t === "diary");
    $("tabSched").setAttribute("aria-selected", t === "sched");
    $("viewDiary").hidden = t !== "diary" || !!state.editing;
    $("viewEditor").hidden = t !== "diary" || !state.editing;
    $("viewSched").hidden = t !== "sched";
    try { localStorage.setItem(LS + "_tab", JSON.stringify(t)); } catch (e) {}
    window.scrollTo(0, 0);
  }
  $("tabDiary").onclick = () => { if (state.tab === "diary" && state.editing) closeEditor(); setTab("diary"); };
  $("tabSched").onclick = () => setTab("sched");

  delete data._tab;
  $("todayChip").textContent = longDate(todayKey());
  renderCalendars();
  initRemote();
})();
</script>
